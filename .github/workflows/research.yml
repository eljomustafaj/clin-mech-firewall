name: Research baseline

on:
  push:
    paths: &research_paths
      - 'mech_interp/**'
      - 'data/**'
      - 'eval/**'
      - 'tests/research/**'
      - 'contracts/research-trace.v1.schema.json'
      - 'artifacts/baseline/**'
      - 'requirements-research.txt'
      - '.gitattributes'
      - '.github/workflows/research.yml'
  pull_request:
    paths: *research_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-research.txt
      - name: Test extraction and audit published results
        run: python -m unittest discover -s tests/research -p "test_*.py" -v
      - name: Validate the research handoff
        run: python -m eval.validate_trace artifacts/baseline/trace.json --probe artifacts/baseline/probe.json
